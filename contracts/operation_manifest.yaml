      type: string
      minLength: 1
      maxLength: 255
      pattern: ^customers/[0-9]{10}/campaigns/[0-9]+$
  outputs:
  - name: customer_id
    value_type: text
    required: true
    schema:
      type: string
      minLength: 10
      maxLength: 10
      pattern: ^[0-9]{10}$
  - name: connection_id
    value_type: text
    required: true
    schema:
      type: string
      minLength: 1
      maxLength: 255
      pattern: ^conn_[A-Za-z0-9_-]+$
  - name: api_version
    value_type: text
    required: true
    schema:
      type: string
      const: v26
  - name: currency_code
    value_type: text
    required: true
    schema:
      type: string
      minLength: 3
      maxLength: 3
      pattern: ^[A-Z]{3}$
  - name: time_zone
    value_type: text
    required: true
    schema:
      type: string
      minLength: 1
      maxLength: 128
  - name: campaign
    value_type: object
    required: true
    schema:
      type: object
      additionalProperties: false
      properties:
        resource_name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^customers/[0-9]{10}/campaigns/[0-9]+$
        name:
          type: string
          minLength: 0
          maxLength: 1024
        status:
          type: string
          enum:
          - UNSPECIFIED
          - UNKNOWN
          - ENABLED
          - PAUSED
          - REMOVED
        advertising_channel_type:
          type: string
          enum:
          - UNSPECIFIED
          - UNKNOWN
          - SEARCH
          - DISPLAY
          - SHOPPING
          - HOTEL
          - VIDEO
          - MULTI_CHANNEL
          - LOCAL
          - SMART
          - PERFORMANCE_MAX
          - LOCAL_SERVICES
          - DISCOVERY
          - TRAVEL
          - DEMAND_GEN
        campaign_budget:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
          pattern: ^customers/[0-9]{10}/campaignBudgets/[0-9]+$
        supported_for_writes:
          type: boolean
        start_date_time:
          type:
          - string
          - 'null'
          minLength: 19
          maxLength: 19
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$
        end_date_time:
          type:
          - string
          - 'null'
          minLength: 19
          maxLength: 19
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$
        network_settings:
          type:
          - object
          - 'null'
          additionalProperties: false
          properties:
            target_google_search:
              type: boolean
            target_search_network:
              type: boolean
            target_content_network:
              type: boolean
            target_partner_search_network:
              type: boolean
          required:
          - target_google_search
          - target_search_network
          - target_content_network
          - target_partner_search_network
        budget:
          type:
          - object
          - 'null'
          additionalProperties: false
          properties:
            resource_name:
              type: string
              minLength: 1
              maxLength: 255
              pattern: ^customers/[0-9]{10}/campaignBudgets/[0-9]+$
            amount_micros:
              type: string
              minLength: 1
              maxLength: 19
              pattern: ^(?:0|[1-9][0-9]{0,18})$
              description: Base-10 int64 micros; runtime must check <= 9223372036854775807
                and currency/bidding increments.
            explicitly_shared:
              type: boolean
          required:
          - resource_name
          - amount_micros
          - explicitly_shared
        bidding:
          type: object
          additionalProperties: false
          properties:
            strategy_type:
              type: string
              minLength: 1
              maxLength: 128
            strategy_resource:
              type:
              - string
              - 'null'
              minLength: 1
              maxLength: 255
              pattern: ^customers/[0-9]{10}/biddingStrategies/[0-9]+$
            cpc_bid_ceiling_micros:
              type:
              - string
              - 'null'
              minLength: 1
              maxLength: 19
              pattern: ^(?:0|[1-9][0-9]{0,18})$
              description: Base-10 int64 micros; runtime must check <= 9223372036854775807
                and currency/bidding increments.
            target_cpa_micros:
              type:
              - string
              - 'null'
              minLength: 1
              maxLength: 19
