type: object
additionalProperties: false
properties:
  expected_customer_id:
    type: string
    minLength: 10
    maxLength: 10
    pattern: ^[0-9]{10}$
  expected_login_customer_id:
    type: string
    minLength: 0
    maxLength: 10
    pattern: ^(?:[0-9]{10})?$
  campaign_resource_name:
    type: string
    minLength: 1
    maxLength: 255
    pattern: ^customers/[0-9]{10}/campaigns/[0-9]+$
  bidding:
    type: object
    additionalProperties: false
    properties:
      strategy:
        type: string
        enum:
        - MANUAL_CPC
        - MAXIMIZE_CLICKS
        - MAXIMIZE_CONVERSIONS
      cpc_bid_ceiling_micros:
        type: string
        minLength: 1
        maxLength: 19
        pattern: ^[1-9][0-9]{0,18}$
        description: Base-10 int64 micros; runtime must check <= 9223372036854775807 and currency/bidding increments.
      target_cpa_micros:
        type: string
        minLength: 1
        maxLength: 19
        pattern: ^[1-9][0-9]{0,18}$
        description: Base-10 int64 micros; runtime must check <= 9223372036854775807 and currency/bidding increments.
    required:
    - strategy
    allOf:
    - if:
        properties:
          strategy:
            const: MANUAL_CPC
      then:
        not:
          anyOf:
          - required:
            - cpc_bid_ceiling_micros
          - required:
            - target_cpa_micros
    - if:
        properties:
          strategy:
            const: MAXIMIZE_CLICKS
      then:
        not:
          required:
          - target_cpa_micros
    - if:
        properties:
          strategy:
            const: MAXIMIZE_CONVERSIONS
      then:
        not:
          required:
          - cpc_bid_ceiling_micros
  expected_current_strategy:
    type: string
    enum:
    - MANUAL_CPC
    - MAXIMIZE_CLICKS
    - MAXIMIZE_CONVERSIONS
  currency_code:
    type: string
    minLength: 3
    maxLength: 3
    pattern: ^[A-Z]{3}$
required:
- expected_customer_id
- expected_login_customer_id
- campaign_resource_name
- bidding
- expected_current_strategy
- currency_code
