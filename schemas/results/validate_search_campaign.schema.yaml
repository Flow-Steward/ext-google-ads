type: object
additionalProperties: false
properties:
  customer_id:
    type: string
    minLength: 10
    maxLength: 10
    pattern: ^[0-9]{10}$
  connection_id:
    type: string
    minLength: 1
    maxLength: 255
    pattern: ^conn_[A-Za-z0-9_-]+$
  api_version:
    type: string
    const: v26
  valid:
    type: boolean
    const: true
  expanded_operation_count:
    type: integer
    minimum: 1
    maximum: 10000
  warnings:
    type: array
    items:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 128
        message:
          type: string
          minLength: 1
          maxLength: 2048
        field_path:
          type: string
          minLength: 0
          maxLength: 512
      required:
      - code
      - message
      - field_path
    minItems: 0
    maxItems: 100
  request_id:
    type: string
    minLength: 1
    maxLength: 255
required:
- customer_id
- connection_id
- api_version
- valid
- expanded_operation_count
- warnings
- request_id
