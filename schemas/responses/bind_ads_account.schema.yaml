oneOf:
- type: object
  additionalProperties: false
  properties:
    ok:
      type: boolean
      const: true
    result:
      type: object
      additionalProperties: false
      properties:
        customer_id:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^[0-9]{10}$
        connection_id:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^conn_[A-Za-z0-9_-]+$
        api_version:
          type: string
          const: v26
        account:
          type: object
          additionalProperties: false
          properties:
            resource_name:
              type: string
              minLength: 1
              maxLength: 64
              pattern: ^customers/[0-9]{10}$
            descriptive_name:
              type:
              - string
              - 'null'
              minLength: 0
              maxLength: 1024
            manager:
              type: boolean
            test_account:
              type: boolean
            status:
              type: string
              enum:
              - UNSPECIFIED
              - UNKNOWN
              - ENABLED
              - CANCELED
              - SUSPENDED
              - CLOSED
            currency_code:
              type: string
              minLength: 3
              maxLength: 3
              pattern: ^[A-Z]{3}$
            time_zone:
              type: string
              minLength: 1
              maxLength: 128
            contains_eu_political_advertising:
              type:
              - string
              - 'null'
              enum:
              - UNSPECIFIED
              - UNKNOWN
              - CONTAINS_EU_POLITICAL_ADVERTISING
              - DOES_NOT_CONTAIN_EU_POLITICAL_ADVERTISING
              - null
          required:
          - resource_name
          - descriptive_name
          - manager
          - test_account
          - status
          - currency_code
          - time_zone
          - contains_eu_political_advertising
      required:
      - customer_id
      - connection_id
      - api_version
      - account
  required:
  - ok
  - result
- type: object
  additionalProperties: false
  properties:
    ok:
      type: boolean
      const: false
    result:
      type: object
      additionalProperties: false
      properties: {}
      required: []
    error_code:
      type: string
      enum:
      - invalid_payload
      - invalid_host_envelope
      - invalid_connection
      - authorization_required
      - permission_denied
      - account_not_bound
      - account_access_lost
      - production_access_required
      - resource_not_found
      - resource_account_mismatch
      - unsupported_configuration
      - validation_failed
      - policy_violation
      - state_conflict
      - rate_limited
      - quota_exceeded
      - provider_unavailable
      - timeout
      - outcome_unknown
      - internal_error
      - external_effect_claim_required
    error:
      type: string
      minLength: 1
      maxLength: 2048
    errors:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          code:
            type: string
            enum:
            - invalid_payload
            - invalid_host_envelope
            - invalid_connection
            - authorization_required
            - permission_denied
            - account_not_bound
            - account_access_lost
            - production_access_required
            - resource_not_found
            - resource_account_mismatch
            - unsupported_configuration
            - validation_failed
            - policy_violation
            - state_conflict
            - rate_limited
            - quota_exceeded
            - provider_unavailable
            - timeout
            - outcome_unknown
            - internal_error
            - external_effect_claim_required
          message:
            type: string
            minLength: 1
            maxLength: 2048
          field_path:
            type: string
            minLength: 0
            maxLength: 512
        required:
        - code
        - message
      minItems: 1
      maxItems: 100
    retryable:
      type: boolean
    request_id:
      type: string
      minLength: 1
      maxLength: 255
    provider_error_code:
      type: string
      minLength: 1
      maxLength: 255
    restart_required:
      type: boolean
    external_effect_status:
      type: string
      enum:
      - failed
      - timeout_unknown
    definitely_no_external_effect:
      type: boolean
  required:
  - ok
  - result
  - error_code
  - error
  - errors
  - retryable
