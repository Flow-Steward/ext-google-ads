type: object
additionalProperties: false
properties:
  expected_customer_id:
    type: string
    minLength: 10
    maxLength: 10
    pattern: ^[0-9]{10}$
  expected_login_customer_id:
    type: string
    minLength: 0
    maxLength: 10
    pattern: ^(?:[0-9]{10})?$
  campaign_resource_name:
    type: string
    minLength: 1
    maxLength: 255
    pattern: ^customers/[0-9]{10}/campaigns/[0-9]+$
  expected_current:
    type: object
    additionalProperties: false
    properties:
      geo_target_constants:
        type: array
        items:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^geoTargetConstants/[0-9]+$
        minItems: 1
        maxItems: 1000
      location_options:
        type: object
        additionalProperties: false
        properties:
          positive_geo_target_type:
            type: string
            enum:
            - PRESENCE
            - PRESENCE_OR_INTEREST
          negative_geo_target_type:
            type: string
            enum:
            - PRESENCE
        required:
        - positive_geo_target_type
        - negative_geo_target_type
      schedule:
        type: object
        additionalProperties: false
        properties:
          mode:
            type: string
            enum:
            - all_time
            - weekly
          intervals:
            type: array
            items:
              type: object
              additionalProperties: false
              properties:
                day:
                  type: string
                  enum:
                  - MONDAY
                  - TUESDAY
                  - WEDNESDAY
                  - THURSDAY
                  - FRIDAY
                  - SATURDAY
                  - SUNDAY
                start_hour:
                  type: integer
                  minimum: 0
                  maximum: 23
                start_minute:
                  type: integer
                  enum:
                  - 0
                  - 15
                  - 30
                  - 45
                end_hour:
                  type: integer
                  minimum: 0
                  maximum: 24
                end_minute:
                  type: integer
                  enum:
                  - 0
                  - 15
                  - 30
                  - 45
              required:
              - day
              - start_hour
              - start_minute
              - end_hour
              - end_minute
            minItems: 1
            maxItems: 42
        required:
        - mode
        allOf:
        - if:
            properties:
              mode:
                const: weekly
          then:
            required:
            - intervals
        - if:
            properties:
              mode:
                const: all_time
          then:
            not:
              required:
              - intervals
    required: []
    anyOf:
    - required:
      - geo_target_constants
    - required:
      - location_options
    - required:
      - schedule
  desired:
    type: object
    additionalProperties: false
    properties:
      geo_target_constants:
        type: array
        items:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^geoTargetConstants/[0-9]+$
        minItems: 1
        maxItems: 1000
      location_options:
        type: object
        additionalProperties: false
        properties:
          positive_geo_target_type:
            type: string
            enum:
            - PRESENCE
            - PRESENCE_OR_INTEREST
          negative_geo_target_type:
            type: string
            enum:
            - PRESENCE
        required:
        - positive_geo_target_type
        - negative_geo_target_type
      schedule:
        type: object
        additionalProperties: false
        properties:
          mode:
            type: string
            enum:
            - all_time
            - weekly
          intervals:
            type: array
            items:
              type: object
              additionalProperties: false
              properties:
                day:
                  type: string
                  enum:
                  - MONDAY
                  - TUESDAY
                  - WEDNESDAY
                  - THURSDAY
                  - FRIDAY
                  - SATURDAY
                  - SUNDAY
                start_hour:
                  type: integer
                  minimum: 0
                  maximum: 23
                start_minute:
                  type: integer
                  enum:
                  - 0
                  - 15
                  - 30
                  - 45
                end_hour:
                  type: integer
                  minimum: 0
                  maximum: 24
                end_minute:
                  type: integer
                  enum:
                  - 0
                  - 15
                  - 30
                  - 45
              required:
              - day
              - start_hour
              - start_minute
              - end_hour
              - end_minute
            minItems: 1
            maxItems: 42
        required:
        - mode
        allOf:
        - if:
            properties:
              mode:
                const: weekly
          then:
            required:
            - intervals
        - if:
            properties:
              mode:
                const: all_time
          then:
            not:
              required:
              - intervals
    required: []
    anyOf:
    - required:
      - geo_target_constants
    - required:
      - location_options
    - required:
      - schedule
required:
- expected_customer_id
- expected_login_customer_id
- campaign_resource_name
- expected_current
- desired
