type: object
additionalProperties: false
properties:
  customer_id:
    type: string
    minLength: 10
    maxLength: 10
    pattern: ^[0-9]{10}$
  connection_id:
    type: string
    minLength: 1
    maxLength: 255
    pattern: ^conn_[A-Za-z0-9_-]+$
  api_version:
    type: string
    const: v26
  request_id:
    type:
    - string
    - 'null'
    minLength: 1
    maxLength: 255
  mutation_operation_count:
    type: integer
    minimum: 0
    maximum: 10000
  campaign_resource_name:
    type: string
    minLength: 1
    maxLength: 255
    pattern: ^customers/[0-9]{10}/campaigns/[0-9]+$
  applied_patch:
    type: object
    additionalProperties: false
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 255
      start_date_time:
        type: string
        minLength: 19
        maxLength: 19
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$
        description: yyyy-MM-dd HH:mm:ss in the bound account timezone; runtime validates calendar and v26 mutation
          rules.
      end_date_time:
        type: string
        minLength: 19
        maxLength: 19
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$
        description: yyyy-MM-dd HH:mm:ss in the bound account timezone; runtime validates calendar and v26 mutation
          rules.
      network_settings:
        type: object
        additionalProperties: false
        properties:
          target_google_search:
            type: boolean
            const: true
          target_search_network:
            type: boolean
          target_content_network:
            type: boolean
            const: false
        required:
        - target_google_search
        - target_search_network
        - target_content_network
    required: []
    anyOf:
    - required:
      - name
    - required:
      - start_date_time
    - required:
      - end_date_time
    - required:
      - network_settings
  update_mask:
    type: array
    items:
      type: string
      enum:
      - name
      - start_date_time
      - end_date_time
      - network_settings.target_google_search
      - network_settings.target_search_network
      - network_settings.target_content_network
    minItems: 1
    maxItems: 6
  status:
    type: string
    enum:
    - PAUSED
    - ENABLED
required:
- customer_id
- connection_id
- api_version
- request_id
- mutation_operation_count
- campaign_resource_name
- applied_patch
- update_mask
- status
