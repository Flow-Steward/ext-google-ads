oneOf:
- type: object
  additionalProperties: false
  properties:
    ok:
      type: boolean
      const: true
    result:
      type: object
      additionalProperties: false
      properties:
        customer_id:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^[0-9]{10}$
        connection_id:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^conn_[A-Za-z0-9_-]+$
        api_version:
          type: string
          const: v26
        currency_code:
          type: string
          minLength: 3
          maxLength: 3
          pattern: ^[A-Z]{3}$
        campaign_resource_name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^customers/[0-9]{10}/campaigns/[0-9]+$
        status:
          type: string
          const: PAUSED
        explicitly_shared:
          type: boolean
          const: false
        resource_mapping:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              local_key:
                type: string
                minLength: 1
                maxLength: 64
              kind:
                type: string
                enum:
                - budget
                - campaign
                - ad_group
                - ad
                - keyword
                - criterion
              resource_name:
                type: string
                minLength: 1
                maxLength: 255
                pattern: ^customers/[0-9]{10}/[A-Za-z]+/[0-9]+(?:~[0-9]+)?$
              status:
                type: string
                enum:
                - PAUSED
                - ENABLED
                - NOT_APPLICABLE
            required:
            - local_key
            - kind
            - resource_name
            - status
          minItems: 1
          maxItems: 10000
        expanded_operation_count:
          type: integer
          minimum: 1
          maximum: 10000
        request_id:
          type: string
          minLength: 1
          maxLength: 255
      required:
      - customer_id
      - connection_id
      - api_version
      - currency_code
      - campaign_resource_name
      - status
      - explicitly_shared
      - resource_mapping
      - expanded_operation_count
      - request_id
    external_effect_status:
      type: string
      const: succeeded
    definitely_no_external_effect:
      type: boolean
      const: false
  required:
  - ok
  - result
  - external_effect_status
  - definitely_no_external_effect
- type: object
  additionalProperties: false
  properties:
    ok:
      type: boolean
      const: false
    result:
      type: object
      additionalProperties: false
      properties: {}
      required: []
    error_code:
      type: string
      enum:
      - invalid_payload
      - invalid_host_envelope
      - invalid_connection
      - authorization_required
      - permission_denied
      - account_not_bound
      - account_access_lost
      - production_access_required
      - resource_not_found
      - resource_account_mismatch
      - unsupported_configuration
      - validation_failed
      - policy_violation
      - state_conflict
      - rate_limited
      - quota_exceeded
      - provider_unavailable
      - timeout
      - outcome_unknown
      - internal_error
      - external_effect_claim_required
    error:
      type: string
      minLength: 1
      maxLength: 2048
    errors:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          code:
            type: string
            enum:
            - invalid_payload
            - invalid_host_envelope
            - invalid_connection
            - authorization_required
            - permission_denied
            - account_not_bound
            - account_access_lost
            - production_access_required
            - resource_not_found
            - resource_account_mismatch
            - unsupported_configuration
            - validation_failed
            - policy_violation
            - state_conflict
            - rate_limited
            - quota_exceeded
            - provider_unavailable
            - timeout
            - outcome_unknown
            - internal_error
            - external_effect_claim_required
          message:
            type: string
            minLength: 1
            maxLength: 2048
          field_path:
            type: string
            minLength: 0
            maxLength: 512
        required:
        - code
        - message
      minItems: 1
      maxItems: 100
    retryable:
      type: boolean
    request_id:
      type: string
      minLength: 1
      maxLength: 255
    provider_error_code:
      type: string
      minLength: 1
      maxLength: 255
    restart_required:
      type: boolean
    external_effect_status:
      type: string
      enum:
      - failed
      - timeout_unknown
    definitely_no_external_effect:
      type: boolean
  required:
  - ok
  - result
  - error_code
  - error
  - errors
  - retryable
- type: object
  additionalProperties: false
  properties:
    ok:
      type: boolean
      const: true
    result:
      type: object
      additionalProperties: false
      properties:
        test_mode_status:
          type: string
          const: suppressed
        external_effect_status:
          type: string
          const: suppressed
        definitely_no_external_effect:
          type: boolean
          const: true
      required:
      - test_mode_status
      - external_effect_status
      - definitely_no_external_effect
    external_effect_status:
      type: string
      const: suppressed
    definitely_no_external_effect:
      type: boolean
      const: true
  required:
  - ok
  - result
  - external_effect_status
  - definitely_no_external_effect
