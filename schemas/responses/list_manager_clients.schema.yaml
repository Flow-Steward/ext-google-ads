oneOf:
- type: object
  additionalProperties: false
  properties:
    ok:
      type: boolean
      const: true
    result:
      type: object
      additionalProperties: false
      properties:
        connection_id:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^conn_[A-Za-z0-9_-]+$
        api_version:
          type: string
          const: v26
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              customer_id:
                type: string
                minLength: 10
                maxLength: 10
                pattern: ^[0-9]{10}$
              manager:
                type:
                - boolean
                - 'null'
              test_account:
                type:
                - boolean
                - 'null'
              descriptive_name:
                type:
                - string
                - 'null'
                minLength: 0
                maxLength: 1024
              access_path:
                type: array
                items:
                  type: string
                  minLength: 10
                  maxLength: 10
                  pattern: ^[0-9]{10}$
                minItems: 1
                maxItems: 21
              depth:
                type: integer
                minimum: 1
                maximum: 20
              branch_status:
                type: string
                enum:
                - accessible
                - inaccessible
                - cycle_detected
                - depth_limit
                - node_limit
                - deadline
              branch_error:
                type:
                - object
                - 'null'
                additionalProperties: false
                properties:
                  code:
                    type: string
                    minLength: 1
                    maxLength: 128
                  message:
                    type: string
                    minLength: 1
                    maxLength: 1024
                required:
                - code
                - message
            required:
            - customer_id
            - manager
            - test_account
            - descriptive_name
            - access_path
            - depth
            - branch_status
            - branch_error
          minItems: 0
          maxItems: 1000
        next_cursor:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 8192
        truncated:
          type: boolean
        manager_id:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^[0-9]{10}$
      required:
      - connection_id
      - api_version
      - items
      - next_cursor
      - truncated
      - manager_id
      allOf:
      - if:
          properties:
            truncated:
              const: true
        then:
          properties:
            next_cursor:
              type: 'null'
  required:
  - ok
  - result
- type: object
  additionalProperties: false
  properties:
    ok:
      type: boolean
      const: false
    result:
      type: object
      additionalProperties: false
      properties: {}
      required: []
    error_code:
      type: string
      enum:
      - invalid_payload
      - invalid_host_envelope
      - invalid_connection
      - authorization_required
      - permission_denied
      - account_not_bound
      - account_access_lost
      - production_access_required
      - resource_not_found
      - resource_account_mismatch
      - unsupported_configuration
      - validation_failed
      - policy_violation
      - state_conflict
      - rate_limited
      - quota_exceeded
      - provider_unavailable
      - timeout
      - outcome_unknown
      - internal_error
      - external_effect_claim_required
    error:
      type: string
      minLength: 1
      maxLength: 2048
    errors:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          code:
            type: string
            enum:
            - invalid_payload
            - invalid_host_envelope
            - invalid_connection
            - authorization_required
            - permission_denied
            - account_not_bound
            - account_access_lost
            - production_access_required
            - resource_not_found
            - resource_account_mismatch
            - unsupported_configuration
            - validation_failed
            - policy_violation
            - state_conflict
            - rate_limited
            - quota_exceeded
            - provider_unavailable
            - timeout
            - outcome_unknown
            - internal_error
            - external_effect_claim_required
          message:
            type: string
            minLength: 1
            maxLength: 2048
          field_path:
            type: string
            minLength: 0
            maxLength: 512
        required:
        - code
        - message
      minItems: 1
      maxItems: 100
    retryable:
      type: boolean
    request_id:
      type: string
      minLength: 1
      maxLength: 255
    provider_error_code:
      type: string
      minLength: 1
      maxLength: 255
    restart_required:
      type: boolean
    external_effect_status:
      type: string
      enum:
      - failed
      - timeout_unknown
    definitely_no_external_effect:
      type: boolean
  required:
  - ok
  - result
  - error_code
  - error
  - errors
  - retryable
