type: object
additionalProperties: false
properties:
  expected_customer_id:
    type: string
    minLength: 10
    maxLength: 10
    pattern: ^[0-9]{10}$
  expected_login_customer_id:
    type: string
    minLength: 0
    maxLength: 10
    pattern: ^(?:[0-9]{10})?$
  campaign_resource_name:
    type: string
    minLength: 1
    maxLength: 255
    pattern: ^customers/[0-9]{10}/campaigns/[0-9]+$
  name:
    type: string
    minLength: 1
    maxLength: 255
  cpc_bid_micros:
    type: string
    minLength: 1
    maxLength: 19
    pattern: ^[1-9][0-9]{0,18}$
    description: Base-10 int64 micros; runtime must check <= 9223372036854775807 and currency/bidding increments.
  currency_code:
    type: string
    minLength: 3
    maxLength: 3
    pattern: ^[A-Z]{3}$
required:
- expected_customer_id
- expected_login_customer_id
- campaign_resource_name
- name
- currency_code
