workflow_id: google_ads_create_paused_search
version: 1.0.0
display_name: Google Ads Create Paused Search
description: Validate and review a saved Search specification, then create PAUSED
  resources. Does not activate delivery. Select the project client connection before
  enabling this draft template.
enabled: false
trigger:
  confidence_threshold: 0.0
settings:
  connection_slots:
  - slot: client
    extension_id: flowsteward.google-ads
    connection_type_ids:
    - google_ads_account
    label: Client
  execution_graph:
    schema_version: 1
    entry:
      kind: step
      id: save_inputs
    edges:
    - source:
        kind: step
        id: save_inputs
      outcome:
        name: success
      target:
        kind: step
        id: validate
      rework: false
    - source:
        kind: step
        id: validate
      outcome:
        name: success
      target:
        kind: step
        id: approve_create
      rework: false
    - source:
        kind: step
        id: approve_create
      outcome:
        name: approved
      target:
        kind: step
        id: create
      rework: false
    - source:
        kind: step
        id: approve_create
      outcome:
        name: rejected
      target:
        kind: step
        id: rejected
      rework: false
    - source:
        kind: step
        id: create
      outcome:
        name: success
      target:
        kind: step
        id: done
      rework: false
  policies:
    branch_strategy: none
  callable:
    enabled: true
    trigger_channels:
    - ui
    - api
    - mcp
    - parent_workflow
    input_mode: fields
    strict_inputs: true
    expected_inputs:
    - name: create_input
      type: object
      required: true
      description: Complete create_search_campaign input, including expected customer/MCC
        assertions and specification.
    output_mode: variables
    expected_outputs:
    - name: created
      type: object
      required: false
      description: Complete created resource mapping.
    expected_artifacts: []
    side_effects:
    - external_write
builder_metadata_jsonb:
  purpose: Validate and review a saved Search specification, then create PAUSED resources.
    Does not activate delivery. Select the project client connection before enabling
    this draft template.
  use_cases:
  - Google Ads agency workflows
  anti_use_cases:
  - Bypass project OAuth or host external-effect authorization
  composition_role: ads_workflow
  determinism_level: external_api
  safe_for_auto_use: false
tags:
- google-ads
- agency
steps:
- step_id: save_inputs
  display_name: Save exact customer and campaign specification
  step_kind: set_variable
  override:
    set_variable:
      assignments:
        state.ads_create_input:
          source: state.inputs.create_input
- step_id: validate
  display_name: Validate search campaign
  step_kind: connector
  connector_id: extension.flowsteward.google-ads
  connection_binding_jsonb:
    slot: client
  override:
    connector:
      extension_id: flowsteward.google-ads
      operation_id: validate_search_campaign
      action_id: validate_search_campaign
  input_mapping_jsonb: &id001
    expected_customer_id: state.ads_create_input.expected_customer_id
    expected_login_customer_id: state.ads_create_input.expected_login_customer_id
    specification: state.ads_create_input.specification
  output_mapping_jsonb:
    result: state.validation
- step_id: approve_create
  display_name: Review customer and exact saved inputs
  step_kind: approval
  override:
    approval:
      show_outputs:
      - state.ads_create_input
      - state.validation
- step_id: create
  display_name: Create search campaign
  step_kind: connector
  connector_id: extension.flowsteward.google-ads
  connection_binding_jsonb:
    slot: client
  override:
    connector:
      extension_id: flowsteward.google-ads
      operation_id: create_search_campaign
      action_id: create_search_campaign
  input_mapping_jsonb: *id001
  output_mapping_jsonb:
    result: state.created
- step_id: done
  display_name: Complete
  step_kind: stop_success
  override:
    stop_success:
      message: Google Ads workflow completed; inspect actual statuses and delivery
        constraints.
- step_id: rejected
  display_name: Stopped
  step_kind: stop_fail
  override:
    stop_fail:
      message: Operator rejected this change.
groups: []
