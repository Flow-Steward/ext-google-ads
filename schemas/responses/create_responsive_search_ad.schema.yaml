oneOf:
- type: object
  additionalProperties: false
  properties:
    ok:
      type: boolean
      const: true
    result:
      type: object
      additionalProperties: false
      properties:
        customer_id:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^[0-9]{10}$
        connection_id:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^conn_[A-Za-z0-9_-]+$
        api_version:
          type: string
          const: v26
        request_id:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
        mutation_operation_count:
          type: integer
          minimum: 0
          maximum: 10000
        ad_resource_name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^customers/[0-9]{10}/ads/[0-9]+$
        ad_group_ad_resource_name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^customers/[0-9]{10}/adGroupAds/[0-9]+~[0-9]+$
        ad_group_resource_name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^customers/[0-9]{10}/adGroups/[0-9]+$
        campaign_resource_name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^customers/[0-9]{10}/campaigns/[0-9]+$
        responsive_search_ad:
          type: object
          additionalProperties: false
          properties:
            headlines:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  text:
                    type: string
                    minLength: 1
                    maxLength: 30
                  pinned_field:
                    type: string
                    enum:
                    - HEADLINE_1
                    - HEADLINE_2
                    - HEADLINE_3
                required:
                - text
              minItems: 3
              maxItems: 15
            descriptions:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  text:
                    type: string
                    minLength: 1
                    maxLength: 90
                  pinned_field:
                    type: string
                    enum:
                    - DESCRIPTION_1
                    - DESCRIPTION_2
                required:
                - text
              minItems: 2
              maxItems: 4
            final_urls:
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 2048
                pattern: ^https?://[^\s]+$
              minItems: 1
              maxItems: 10
            path1:
              type: string
              minLength: 0
              maxLength: 15
            path2:
              type: string
              minLength: 0
              maxLength: 15
          required:
          - headlines
          - descriptions
          - final_urls
          dependentRequired:
            path2:
            - path1
        status:
          type: string
          const: PAUSED
        policy:
          type: object
          additionalProperties: false
          properties:
            review_status:
              type: string
              enum:
              - UNKNOWN
              - REVIEW_IN_PROGRESS
              - REVIEWED
              - UNDER_APPEAL
            approval_status:
              type: string
              enum:
              - UNKNOWN
              - APPROVED
              - APPROVED_LIMITED
              - DISAPPROVED
              - AREA_OF_INTEREST_ONLY
          required:
          - review_status
          - approval_status
      required:
      - customer_id
      - connection_id
      - api_version
      - request_id
      - mutation_operation_count
      - ad_resource_name
      - ad_group_ad_resource_name
      - ad_group_resource_name
      - campaign_resource_name
      - responsive_search_ad
      - status
      - policy
    external_effect_status:
      type: string
      const: succeeded
    definitely_no_external_effect:
      type: boolean
      const: false
  required:
  - ok
  - result
  - external_effect_status
  - definitely_no_external_effect
- type: object
  additionalProperties: false
  properties:
    ok:
      type: boolean
      const: false
    result:
      type: object
      additionalProperties: false
      properties: {}
      required: []
    error_code:
      type: string
      enum:
      - invalid_payload
      - invalid_host_envelope
      - invalid_connection
      - authorization_required
      - permission_denied
      - account_not_bound
      - account_access_lost
      - production_access_required
      - resource_not_found
      - resource_account_mismatch
      - unsupported_configuration
      - validation_failed
      - policy_violation
      - state_conflict
      - rate_limited
      - quota_exceeded
      - provider_unavailable
      - timeout
      - outcome_unknown
      - internal_error
      - external_effect_claim_required
    error:
      type: string
      minLength: 1
      maxLength: 2048
    errors:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          code:
            type: string
            enum:
            - invalid_payload
            - invalid_host_envelope
            - invalid_connection
            - authorization_required
            - permission_denied
            - account_not_bound
            - account_access_lost
            - production_access_required
            - resource_not_found
            - resource_account_mismatch
            - unsupported_configuration
            - validation_failed
            - policy_violation
            - state_conflict
            - rate_limited
            - quota_exceeded
            - provider_unavailable
            - timeout
            - outcome_unknown
            - internal_error
            - external_effect_claim_required
          message:
            type: string
            minLength: 1
            maxLength: 2048
          field_path:
            type: string
            minLength: 0
            maxLength: 512
        required:
        - code
        - message
      minItems: 1
      maxItems: 100
    retryable:
      type: boolean
    request_id:
      type: string
      minLength: 1
      maxLength: 255
    provider_error_code:
      type: string
      minLength: 1
      maxLength: 255
    restart_required:
      type: boolean
    external_effect_status:
      type: string
      enum:
      - failed
      - timeout_unknown
    definitely_no_external_effect:
      type: boolean
  required:
  - ok
  - result
  - error_code
  - error
  - errors
  - retryable
- type: object
  additionalProperties: false
  properties:
    ok:
      type: boolean
      const: true
    result:
      type: object
      additionalProperties: false
      properties:
        test_mode_status:
          type: string
          const: suppressed
        external_effect_status:
          type: string
          const: suppressed
        definitely_no_external_effect:
          type: boolean
          const: true
      required:
      - test_mode_status
      - external_effect_status
      - definitely_no_external_effect
    external_effect_status:
      type: string
      const: suppressed
    definitely_no_external_effect:
      type: boolean
      const: true
  required:
  - ok
  - result
  - external_effect_status
  - definitely_no_external_effect
