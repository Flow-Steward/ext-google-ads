  data_schema_version: 1
  data_migrations: []
extension_id: flowsteward.google-ads
release_version: 1.0.0
extension_type: service_extension
identity:
  display_name: Google Ads
  description: Search advertising across project connections.
  tags:
  - google
  - advertising
  - search
  - agencies
vendor:
  vendor_name: Flow Steward
distribution:
  channel: private_byo
  execution_modes:
  - local
  allows_self_hosted: true
  requires_connected_control_plane: false
  import_sources:
