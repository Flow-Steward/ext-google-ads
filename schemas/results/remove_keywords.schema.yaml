type: object
additionalProperties: false
properties:
  customer_id:
    type: string
    minLength: 10
    maxLength: 10
    pattern: ^[0-9]{10}$
  connection_id:
    type: string
    minLength: 1
    maxLength: 255
    pattern: ^conn_[A-Za-z0-9_-]+$
  api_version:
    type: string
    const: v26
  request_id:
    type:
    - string
    - 'null'
    minLength: 1
    maxLength: 255
  mutation_operation_count:
    type: integer
    minimum: 0
    maximum: 10000
  items:
    type: array
    items:
      type: object
      additionalProperties: false
      properties:
        input_index:
          type: integer
          minimum: 0
          maximum: 9999
        criterion_resource_name:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 255
            pattern: ^customers/[0-9]{10}/adGroupCriteria/[0-9]+~[0-9]+$
          - type: string
            minLength: 1
            maxLength: 255
            pattern: ^customers/[0-9]{10}/campaignCriteria/[0-9]+~[0-9]+$
        polarity:
          type: string
          enum:
          - POSITIVE
          - NEGATIVE
        outcome:
          type: string
          enum:
          - REMOVED
          - ALREADY_REMOVED
        status:
          type: string
          const: REMOVED
      required:
      - input_index
      - criterion_resource_name
      - polarity
      - outcome
      - status
    minItems: 1
    maxItems: 10000
required:
- customer_id
- connection_id
- api_version
- request_id
- mutation_operation_count
- items
