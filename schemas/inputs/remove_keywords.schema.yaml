type: object
additionalProperties: false
properties:
  expected_customer_id:
    type: string
    minLength: 10
    maxLength: 10
    pattern: ^[0-9]{10}$
  expected_login_customer_id:
    type: string
    minLength: 0
    maxLength: 10
    pattern: ^(?:[0-9]{10})?$
  criterion_resource_names:
    type: array
    items:
      anyOf:
      - type: string
        minLength: 1
        maxLength: 255
        pattern: ^customers/[0-9]{10}/adGroupCriteria/[0-9]+~[0-9]+$
      - type: string
        minLength: 1
        maxLength: 255
        pattern: ^customers/[0-9]{10}/campaignCriteria/[0-9]+~[0-9]+$
    minItems: 1
    maxItems: 10000
required:
- expected_customer_id
- expected_login_customer_id
- criterion_resource_names
