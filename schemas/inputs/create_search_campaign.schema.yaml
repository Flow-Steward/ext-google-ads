type: object
additionalProperties: false
properties:
  expected_customer_id:
    type: string
    minLength: 10
    maxLength: 10
    pattern: ^[0-9]{10}$
  expected_login_customer_id:
    type: string
    minLength: 0
    maxLength: 10
    pattern: ^(?:[0-9]{10})?$
  specification:
    type: object
    additionalProperties: false
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 255
      currency_code:
        type: string
        minLength: 3
        maxLength: 3
        pattern: ^[A-Z]{3}$
      average_daily_budget_micros:
        type: string
        minLength: 1
        maxLength: 19
        pattern: ^[1-9][0-9]{0,18}$
        description: Base-10 int64 micros; runtime must check <= 9223372036854775807 and currency/bidding increments.
      bidding:
        type: object
        additionalProperties: false
        properties:
          strategy:
            type: string
            enum:
            - MANUAL_CPC
            - MAXIMIZE_CLICKS
            - MAXIMIZE_CONVERSIONS
          cpc_bid_ceiling_micros:
            type: string
            minLength: 1
            maxLength: 19
            pattern: ^[1-9][0-9]{0,18}$
            description: Base-10 int64 micros; runtime must check <= 9223372036854775807 and currency/bidding increments.
          target_cpa_micros:
            type: string
            minLength: 1
            maxLength: 19
            pattern: ^[1-9][0-9]{0,18}$
            description: Base-10 int64 micros; runtime must check <= 9223372036854775807 and currency/bidding increments.
        required:
        - strategy
        allOf:
        - if:
            properties:
              strategy:
                const: MANUAL_CPC
          then:
            not:
              anyOf:
              - required:
                - cpc_bid_ceiling_micros
              - required:
                - target_cpa_micros
        - if:
            properties:
              strategy:
                const: MAXIMIZE_CLICKS
          then:
            not:
              required:
              - target_cpa_micros
        - if:
            properties:
              strategy:
                const: MAXIMIZE_CONVERSIONS
          then:
            not:
              required:
              - cpc_bid_ceiling_micros
      start_date_time:
        type: string
        minLength: 19
        maxLength: 19
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$
      end_date_time:
        type: string
        minLength: 19
        maxLength: 19
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$
      network_settings:
        type: object
        additionalProperties: false
        properties:
          target_google_search:
            type: boolean
            const: true
          target_search_network:
            type: boolean
          target_content_network:
            type: boolean
            const: false
        required:
        - target_google_search
        - target_search_network
        - target_content_network
      contains_eu_political_advertising:
        type: string
        enum:
        - DOES_NOT_CONTAIN_EU_POLITICAL_ADVERTISING
        - CONTAINS_EU_POLITICAL_ADVERTISING
      targeting:
        type: object
        additionalProperties: false
        properties:
          geo_target_constants:
            type: array
            items:
              type: string
              minLength: 1
              maxLength: 128
              pattern: ^geoTargetConstants/[0-9]+$
            minItems: 1
            maxItems: 1000
          location_options:
            type: object
            additionalProperties: false
            properties:
              positive_geo_target_type:
                type: string
                enum:
                - PRESENCE
                - PRESENCE_OR_INTEREST
              negative_geo_target_type:
                type: string
                enum:
                - PRESENCE
            required:
            - positive_geo_target_type
            - negative_geo_target_type
          schedule:
            type: object
            additionalProperties: false
            properties:
              mode:
                type: string
                enum:
                - all_time
                - weekly
              intervals:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    day:
                      type: string
                      enum:
                      - MONDAY
                      - TUESDAY
                      - WEDNESDAY
                      - THURSDAY
                      - FRIDAY
                      - SATURDAY
                      - SUNDAY
                    start_hour:
                      type: integer
                      minimum: 0
                      maximum: 23
                    start_minute:
                      type: integer
                      enum:
                      - 0
                      - 15
                      - 30
                      - 45
                    end_hour:
                      type: integer
                      minimum: 0
                      maximum: 24
                    end_minute:
                      type: integer
                      enum:
                      - 0
                      - 15
                      - 30
                      - 45
                  required:
                  - day
                  - start_hour
                  - start_minute
                  - end_hour
                  - end_minute
                minItems: 1
                maxItems: 42
            required:
            - mode
            allOf:
            - if:
                properties:
                  mode:
                    const: weekly
              then:
                required:
                - intervals
            - if:
                properties:
                  mode:
                    const: all_time
              then:
                not:
                  required:
                  - intervals
        required:
        - geo_target_constants
        - location_options
        - schedule
      ad_groups:
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            key:
              type: string
              minLength: 1
              maxLength: 64
              pattern: ^[A-Za-z0-9_-]+$
            name:
              type: string
              minLength: 1
              maxLength: 255
            cpc_bid_micros:
              type: string
              minLength: 1
              maxLength: 19
              pattern: ^[1-9][0-9]{0,18}$
              description: Base-10 int64 micros; runtime must check <= 9223372036854775807 and currency/bidding
                increments.
            ads:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  key:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^[A-Za-z0-9_-]+$
                  content:
                    type: object
                    additionalProperties: false
                    properties:
                      headlines:
                        type: array
                        items:
                          type: object
                          additionalProperties: false
                          properties:
                            text:
                              type: string
                              minLength: 1
                              maxLength: 30
                            pinned_field:
                              type: string
                              enum:
                              - HEADLINE_1
                              - HEADLINE_2
                              - HEADLINE_3
                          required:
                          - text
                        minItems: 3
                        maxItems: 15
                      descriptions:
                        type: array
                        items:
                          type: object
                          additionalProperties: false
                          properties:
                            text:
                              type: string
                              minLength: 1
                              maxLength: 90
                            pinned_field:
                              type: string
                              enum:
                              - DESCRIPTION_1
                              - DESCRIPTION_2
                          required:
                          - text
                        minItems: 2
                        maxItems: 4
                      final_urls:
                        type: array
                        items:
                          type: string
                          minLength: 1
                          maxLength: 2048
                          pattern: ^https?://[^\s]+$
                        minItems: 1
                        maxItems: 10
                      path1:
                        type: string
                        minLength: 0
                        maxLength: 15
                      path2:
                        type: string
                        minLength: 0
                        maxLength: 15
                    required:
                    - headlines
                    - descriptions
                    - final_urls
                    dependentRequired:
                      path2:
                      - path1
                required:
                - key
                - content
              minItems: 1
              maxItems: 1000
            keywords:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  key:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^[A-Za-z0-9_-]+$
                  text:
                    type: string
                    minLength: 1
                    maxLength: 80
                  match_type:
                    type: string
                    enum:
                    - EXACT
                    - PHRASE
                    - BROAD
                  cpc_bid_micros:
                    type: string
                    minLength: 1
                    maxLength: 19
                    pattern: ^[1-9][0-9]{0,18}$
                    description: Base-10 int64 micros; runtime must check <= 9223372036854775807 and currency/bidding
                      increments.
                required:
                - key
                - text
                - match_type
              minItems: 1
              maxItems: 10000
          required:
          - key
          - name
          - ads
          - keywords
        minItems: 1
        maxItems: 1000
    required:
    - name
    - currency_code
    - average_daily_budget_micros
    - bidding
    - network_settings
    - contains_eu_political_advertising
    - targeting
    - ad_groups
required:
- expected_customer_id
- expected_login_customer_id
- specification
