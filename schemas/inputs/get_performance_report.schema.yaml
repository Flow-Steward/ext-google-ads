oneOf:
- type: object
  additionalProperties: false
  properties:
    report_type:
      type: string
      const: account_summary
    start_date:
      type: string
      minLength: 10
      maxLength: 10
      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
      description: Calendar date; runtime checks validity, ordering and account timezone.
    end_date:
      type: string
      minLength: 10
      maxLength: 10
      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
      description: Calendar date; runtime checks validity, ordering and account timezone.
    dimensions:
      type: array
      items:
        type: string
        enum:
        - date
        - device
      enum:
      - []
      - - date
      - - device
      - - date
        - device
      minItems: 0
      maxItems: 2
    metrics:
      type: array
      items:
        type: string
        enum:
        - impressions
        - clicks
        - cost_micros
        - conversions
        - conversion_value
        - ctr
        - average_cpc_micros
        - cpa_micros
        - roas
      minItems: 1
      maxItems: 9
  required:
  - report_type
  - start_date
  - end_date
  - dimensions
  - metrics
