type: object
additionalProperties: false
properties:
  customer_id:
    type: string
    minLength: 10
    maxLength: 10
    pattern: ^[0-9]{10}$
  connection_id:
    type: string
    minLength: 1
    maxLength: 255
    pattern: ^conn_[A-Za-z0-9_-]+$
  api_version:
    type: string
    const: v26
  request_id:
    type:
    - string
    - 'null'
    minLength: 1
    maxLength: 255
  mutation_operation_count:
    type: integer
    minimum: 0
    maximum: 10000
  ad_group_resource_name:
    type: string
    minLength: 1
    maxLength: 255
    pattern: ^customers/[0-9]{10}/adGroups/[0-9]+$
  campaign_resource_name:
    type: string
    minLength: 1
    maxLength: 255
    pattern: ^customers/[0-9]{10}/campaigns/[0-9]+$
  currency_code:
    type: string
    minLength: 3
    maxLength: 3
    pattern: ^[A-Z]{3}$
  items:
    type: array
    items:
      type: object
      additionalProperties: false
      properties:
        input_index:
          type: integer
          minimum: 0
          maximum: 9999
        criterion_resource_name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^customers/[0-9]{10}/adGroupCriteria/[0-9]+~[0-9]+$
        text:
          type: string
          minLength: 1
          maxLength: 80
        match_type:
          type: string
          enum:
          - EXACT
          - PHRASE
          - BROAD
        outcome:
          type: string
          enum:
          - CREATED
          - UPDATED
          - UNCHANGED
        status:
          type: string
          enum:
          - ENABLED
          - PAUSED
        cpc_bid_micros:
          type: string
          minLength: 1
          maxLength: 19
          pattern: ^[1-9][0-9]{0,18}$
          description: Base-10 int64 micros; runtime must check <= 9223372036854775807 and currency/bidding increments.
        update_mask:
          type: array
          items:
            type: string
            enum:
            - cpc_bid_micros
            - status
          minItems: 0
          maxItems: 2
      required:
      - input_index
      - criterion_resource_name
      - text
      - match_type
      - outcome
      - status
      - update_mask
    minItems: 1
    maxItems: 10000
required:
- customer_id
- connection_id
- api_version
- request_id
- mutation_operation_count
- ad_group_resource_name
- campaign_resource_name
- currency_code
- items
