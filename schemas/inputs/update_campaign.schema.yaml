type: object
additionalProperties: false
properties:
  expected_customer_id:
    type: string
    minLength: 10
    maxLength: 10
    pattern: ^[0-9]{10}$
  expected_login_customer_id:
    type: string
    minLength: 0
    maxLength: 10
    pattern: ^(?:[0-9]{10})?$
  campaign_resource_name:
    type: string
    minLength: 1
    maxLength: 255
    pattern: ^customers/[0-9]{10}/campaigns/[0-9]+$
  patch:
    type: object
    additionalProperties: false
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 255
      start_date_time:
        type: string
        minLength: 19
        maxLength: 19
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$
        description: yyyy-MM-dd HH:mm:ss in the bound account timezone; runtime validates calendar and v26 mutation
          rules.
      end_date_time:
        type: string
        minLength: 19
        maxLength: 19
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$
        description: yyyy-MM-dd HH:mm:ss in the bound account timezone; runtime validates calendar and v26 mutation
          rules.
      network_settings:
        type: object
        additionalProperties: false
        properties:
          target_google_search:
            type: boolean
            const: true
          target_search_network:
            type: boolean
          target_content_network:
            type: boolean
            const: false
        required:
        - target_google_search
        - target_search_network
        - target_content_network
    required: []
    anyOf:
    - required:
      - name
    - required:
      - start_date_time
    - required:
      - end_date_time
    - required:
      - network_settings
required:
- expected_customer_id
- expected_login_customer_id
- campaign_resource_name
- patch
