manifest_version: 2
lifecycle:
  data_schema_version: 1
  data_migrations: []
extension_id: flowsteward.google-ads
kind: tool_provider
version: 1.0.4
runtime:
  contract_version: extension_host_v2
  compatibility:
    platform_min: 1.9.0
  extension_contract_v2:
    oauth_providers:
    - provider_id: google_ads_oauth
      display_name: Google Ads
      description: Project-scoped Google OAuth application; one grant per connection.
      setup_page_id: setup
      help_page_id: setup
      flow:
        type: authorization_code
        pkce: s256
      credential_fields:
      - field_id: client_id
        value_type: text
        required: true
        secret: false
        browser_exposable: true
        change_policy: reauthorization_required
        label: Google OAuth Client ID
        help_text: Use the Web application OAuth client from the API-enabled Cloud project.
        autocomplete: username
        validation:
          min_length: 1
          max_length: 512
      - field_id: client_secret
        value_type: secret
        required: true
        secret: true
        change_policy: runtime_revalidate
        label: Google OAuth Client Secret
        help_text: Use the client secret matching this project configuration.
        autocomplete: current-password
        validation:
          min_length: 1
          max_length: 4096
      authorization_endpoint:
        url: https://accounts.google.com/o/oauth2/v2/auth
      token_endpoint:
        url: https://oauth2.googleapis.com/token
        client_auth_method: client_secret_post
      revocation_endpoint:
        url: https://oauth2.googleapis.com/revoke
      callback_id: oauth_authorization
      authorization_intents:
      - intent_id: connect
        static_parameters:
          access_type: offline
          include_granted_scopes: false
          prompt: consent select_account
        user_inputs:
        - input_id: email_hint
          parameter: login_hint
          validation:
            type: email
            max_length: 320
      post_connect_action_id: verify_google_identity
    connection_types: contracts/connection_types.yaml
    operation_manifest: contracts/operation_manifest.yaml
    step_ui_manifest: contracts/step_ui_manifest.yaml
display_name: Google Ads
description: >-
  Create paused Search campaigns, manage ads and targeting, and read performance
  reports across project-scoped Google Ads accounts. Maintained by Flow Steward;
  live OAuth and advertising workflow acceptance is pending.
vendor:
  name: Flow Steward
  support_url: https://github.com/Flow-Steward/ext-google-ads/issues
  website_url: https://github.com/Flow-Steward/ext-google-ads
listing:
  category: marketing
  tags:
  - google
  - advertising
  - search
  - agencies
  summary: Manage Search campaigns and reports across agency client accounts.
  setup_summary: >-
    Configure your Google Cloud OAuth Web client, authorize each project connection,
    and select the customer and optional manager account. Live acceptance is pending.
features:
- tool
- action
event_subscriptions: []
required_scopes:
- extension:invoke
schemas:
  config: schemas/config.schema.yaml
  secrets: schemas/secrets.schema.yaml
  subscriptions: schemas/subscriptions.schema.yaml
entrypoint:
  mode: subprocess
  command:
  - python3
  - main.py
  timeout_policy:
    env: FS_EXTENSION_OPERATION_TIMEOUT_SECONDS
    default_seconds: 300
    minimum_seconds: 30
    maximum_seconds: 3600
    headroom_seconds: 30
health:
  command:
  - python3
  - health.py
  timeout_seconds: 5
ui_manifest: ui/ui_manifest.yaml
action_manifest: ui/actions/actions.yaml
