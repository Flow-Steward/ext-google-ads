type: object
additionalProperties: false
properties:
  connection_id:
    type: string
    minLength: 1
    maxLength: 255
    pattern: ^conn_[A-Za-z0-9_-]+$
  api_version:
    type: string
    const: v26
  items:
    type: array
    items:
      type: object
      additionalProperties: false
      properties:
        customer_id:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^[0-9]{10}$
        resource_name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^customers/[0-9]{10}$
        descriptive_name:
          type:
          - string
          - 'null'
          minLength: 0
          maxLength: 1024
        manager:
          type:
          - boolean
          - 'null'
        test_account:
          type:
          - boolean
          - 'null'
        currency_code:
          type:
          - string
          - 'null'
          minLength: 3
          maxLength: 3
          pattern: ^[A-Z]{3}$
        time_zone:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 128
        metadata_error:
          type:
          - object
          - 'null'
          additionalProperties: false
          properties:
            code:
              type: string
              enum:
              - permission_denied
              - not_found
              - rate_limited
              - provider_error
            message:
              type: string
              minLength: 1
              maxLength: 1024
          required:
          - code
          - message
      required:
      - customer_id
      - resource_name
      - descriptive_name
      - manager
      - test_account
      - currency_code
      - time_zone
      - metadata_error
    minItems: 0
    maxItems: 1000
  next_cursor:
    type:
    - string
    - 'null'
    minLength: 1
    maxLength: 8192
  truncated:
    type: boolean
required:
- connection_id
- api_version
- items
- next_cursor
- truncated
allOf:
- if:
    properties:
      truncated:
        const: true
  then:
    properties:
      next_cursor:
        type: 'null'
